<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Royal Reels Australia</title>

  <!-- Microsoft Clarity -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){
        (c[a].q=c[a].q||[]).push(arguments)
      };
      t=l.createElement(r);
      t.async=1;
      t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];
      y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "zbwbmv4cyh");
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #12071d;
    }

    .hero {
      min-height: 100vh;
      width: 100%;
      position: relative;

      background:
        linear-gradient(
          rgba(13, 4, 25, 0.45),
          rgba(13, 4, 25, 0.62)
        ),
        url("royal-reels-bg1.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;
      text-align: center;
      overflow: hidden;
    }

    .hero-content {
      max-width: 850px;
      position: relative;
      z-index: 2;
    }

    .age-badge {
      display: inline-block;
      padding: 9px 18px;
      margin-bottom: 24px;

      border: 2px solid rgba(255,255,255,.9);
      border-radius: 999px;

      background: rgba(0,0,0,.28);
      backdrop-filter: blur(5px);

      font-size: 18px;
      font-weight: 700;
    }

    h1 {
      font-size: clamp(42px, 5vw, 72px);
      line-height: 1.05;
      font-weight: 800;
      margin-bottom: 24px;

      text-shadow: 0 4px 20px rgba(0,0,0,.45);
    }

    .subtitle {
      font-size: clamp(18px, 2vw, 24px);
      line-height: 1.5;
      margin-bottom: 36px;

      text-shadow: 0 3px 14px rgba(0,0,0,.5);
    }

    .explore-btn {
      display: inline-block;

      padding: 17px 38px;

      background: #fff;
      color: #111;

      text-decoration: none;
      font-size: 20px;
      font-weight: 700;

      border-radius: 10px;

      box-shadow: 0 10px 28px rgba(0,0,0,.3);

      transition: transform .2s ease, box-shadow .2s ease;
    }

    .explore-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(0,0,0,.4);
    }

    .responsible {
      position: absolute;
      left: 0;
      bottom: 18px;
      width: 100%;

      padding: 0 20px;

      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,.78);

      z-index: 2;
    }

    @media (max-width: 600px) {
      .hero {
        padding: 25px 18px 70px;
        background-position: center;
      }

      h1 {
        font-size: 40px;
      }

      .subtitle {
        font-size: 18px;
      }

      .explore-btn {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="hero-content">

      <div class="age-badge">
        18+
      </div>

      <h1>Royal Reels Australia</h1>

      <p class="subtitle">
        Discover popular games and explore Royal Reels online.
      </p>

      <a href="#" class="explore-btn">
        Explore Now
      </a>

    </div>

    <div class="responsible">
      18+ | Please play responsibly
    </div>

  </section>

</body>
</html>
